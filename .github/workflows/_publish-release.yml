name: _publish-release

# Reusable workflow that performs the actual npm publish for the
# stable release path. Called from publish.yml (the Trusted
# Publisher entrypoint registered on npmjs.com).
#
# Note: this file is NOT the Trusted Publisher. npm validates the
# entrypoint (publish.yml), not the reusable workflow. Permissions
# for OIDC are declared at the entrypoint level.

on:
  workflow_call:

permissions: {}

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing requires npm CLI >= 11.5.1; the image ships
      # with an older npm, so we upgrade explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Anti-republish guard
        run: |
          PKG=$(node -p "require('./packages/fp/package.json').name")
          VER=$(node -p "require('./packages/fp/package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "::error::${PKG}@${VER} is already published"
            exit 1
          fi

      - run: pnpm build

      - run: pnpm test

      # Smoke test the built artifact before publishing. If the ESM
      # loader cannot resolve the entry, or any expected export is
      # missing, fail fast.
      - name: Smoke test the built artifact
        run: |
          node --input-type=module -e "
            import * as m from './packages/fp/dist/index.js';
            for (const name of ['ok', 'err', 'some', 'none', 'maybe']) {
              if (typeof m[name] !== 'function') {
                throw new Error('expected export missing: ' + name);
              }
            }
            console.log('smoke OK');
          "

      - run: pnpm changeset publish --provenance --tag latest

      - name: Create git tag
        run: |
          VER=$(node -p "require('./packages/fp/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VER}" -m "Release v${VER}"
          git push origin "v${VER}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v$(node -p "require('./packages/fp/package.json').version")
          generate_release_notes: true