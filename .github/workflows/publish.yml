name: Publish

# The Trusted Publisher entrypoint. Registered on npmjs.com with
# Workflow filename = "publish.yml" and Environment name = "release".
#
# npm Trusted Publishing validates the workflow file that contains
# the step `pnpm changeset publish`. All publish steps are therefore
# inlined in this single file (not in reusable workflows) so that
# the OIDC token's workflow_ref claim matches the registered name.
#
# Three publish paths are supported, gated by the check-release job:
#   - release:  push to main with pending changesets
#   - hotfix:   push tag vX.Y.Z on main
#   - canary:   pull_request to staging with a changeset

on:
  push:
    branches: [main]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging]

permissions: {}

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Detect whether there is anything to publish. For push events
  # to main, this corresponds to a Changesets "Version Packages"
  # PR having been merged with pending changesets. For pull
  # requests to staging, this corresponds to the PR containing a
  # changeset file under .changeset/. Tag pushes are always
  # considered publishable (a tag is an explicit signal).
  #
  # When no changesets are pending, this job exits 0 and the
  # downstream jobs are skipped — the workflow run reports green
  # with an explicit "nothing to publish" log line.
  check-release:
    name: Detect pending changesets
    runs-on: ubuntu-latest
    outputs:
      has_changeset: ${{ steps.detect.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Detect pending changesets
        id: detect
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && \
             case "$GITHUB_REF" in refs/tags/v*) true ;; *) false ;; esac; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Tag push detected — proceeding with hotfix publish."
            exit 0
          fi

          count=$(ls .changeset/*.md 2>/dev/null \
            | grep -v 'README.md$' \
            | grep -v 'config.json$' \
            | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$count changeset(s) detected."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — nothing to publish."
          fi

  # Stable release: triggered by push to main after a "Version
  # Packages" PR is merged.
  #
  # Note: this job is NOT gated on check-release. The reason is
  # that by the time the push reaches main, the changeset has
  # already been consumed by the Version Packages PR. The
  # .changeset/ directory is empty. The actual gate for whether
  # to publish is the anti-republish guard: if the local version
  # already exists on npm, the publish step fails cleanly and
  # the job exits without publishing.
  release:
    if: >-
      github.event_name == 'push'
      && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing requires npm CLI >= 11.5.1; the image ships
      # with an older npm, so we upgrade explicitly.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Anti-republish guard
        run: |
          PKG=$(node -p "require('./packages/fp/package.json').name")
          VER=$(node -p "require('./packages/fp/package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "::error::${PKG}@${VER} is already published"
            exit 1
          fi

      - run: pnpm build

      - run: pnpm test

      - name: Smoke test the built artifact
        run: |
          node --input-type=module -e "
            import * as m from './packages/fp/dist/index.js';
            // Each expected export must exist and be either a
            // function (constructors ok/err/some/maybe) or an
            // object sentinel (none is a const object).
            for (const name of ['ok', 'err', 'some', 'none', 'maybe']) {
              const t = typeof m[name];
              if (t !== 'function' && t !== 'object') {
                throw new Error('expected export missing or wrong type: ' + name + ' (got ' + t + ')');
              }
            }
            console.log('smoke OK');
          "

      - run: pnpm changeset publish --provenance --tag latest

      - name: Create git tag
        run: |
          VER=$(node -p "require('./packages/fp/package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VER}" -m "Release v${VER}"
          git push origin "v${VER}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: v$(node -p "require('./packages/fp/package.json').version")
          generate_release_notes: true

  # Hotfix: triggered by a tag push on main. The tag is created by
  # a maintainer as part of the hotfix procedure.
  #
  # Note: not gated on check-release. Tag pushes always publish;
  # the package.json version must match the tag (verified by the
  # 'Verify version matches tag' step), and the anti-republish
  # guard catches duplicate publishes.
  hotfix:
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: main

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # The hotfix branch is responsible for having bumped the
      # version in packages/fp/package.json before merging. If the
      # version was not bumped, this guard catches it.
      - name: Verify version matches tag
        run: |
          PKG=$(node -p "require('./packages/fp/package.json').name")
          VER=$(node -p "require('./packages/fp/package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG_VER" ]; then
            echo "::error::package.json version ($VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "Publishing ${PKG}@${VER}"

      - name: Anti-republish guard
        run: |
          PKG=$(node -p "require('./packages/fp/package.json').name")
          VER=$(node -p "require('./packages/fp/package.json').version")
          if npm view "${PKG}@${VER}" version >/dev/null 2>&1; then
            echo "::error::${PKG}@${VER} is already published"
            exit 1
          fi

      - run: pnpm build

      - run: pnpm test

      - name: Smoke test the built artifact
        run: |
          node --input-type=module -e "
            import * as m from './packages/fp/dist/index.js';
            // Each expected export must exist and be either a
            // function (constructors ok/err/some/maybe) or an
            // object sentinel (none is a const object).
            for (const name of ['ok', 'err', 'some', 'none', 'maybe']) {
              const t = typeof m[name];
              if (t !== 'function' && t !== 'object') {
                throw new Error('expected export missing or wrong type: ' + name + ' (got ' + t + ')');
              }
            }
            console.log('smoke OK');
          "

      - run: pnpm changeset publish --provenance --tag latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  # Canary: per-PR snapshot published to the @canary dist-tag.
  canary:
    needs: check-release
    if: >-
      needs.check-release.outputs.has_changeset == 'true'
      && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # Generate a snapshot version like 0.0.0-canary-<timestamp>.
      # The --snapshot flag prevents the version bump from being
      # committed to the branch. The check-release job already
      # ensured a changeset is pending, but we re-check here for
      # defense in depth.
      - name: Snapshot version
        run: pnpm changeset version --snapshot canary

      - run: pnpm changeset publish --tag canary --no-git-tag

      - name: Comment on PR with install instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pkg = require('./packages/fp/package.json');
            const ver = pkg.version;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `✅ Canary snapshot published: \`${pkg.name}@${ver}\``,
                '',
                'Install with:',
                '```',
                `pnpm add ${pkg.name}@canary`,
                '```',
                '',
                '_This is a snapshot build. Do not depend on it in production._',
              ].join('\n'),
            });