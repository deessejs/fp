name: Docs lint (Vale)

# Runs Vale on the public documentation site only.
# Scope is intentionally narrow:
#   - apps/web/content/docs/{index,getting-started,result,maybe,unit}.mdx
# Out of scope:
#   - apps/web/content/docs/api-reference.mdx
#     The MDX parser (mdx2vast) fails on the `<TypeTable type={...}>`
#     blocks that contain commas inside JSX attributes. Fixing the
#     parser compat is tracked separately; for phase 1 we exclude the
#     file so the rest of the site can be linted.
#   - packages/fp/src/**    (JSDoc; tracked by a follow-up lint:jsdoc script)
#   - docs/engineering/**   (internal docs; Vale can be extended later)
#   - .changeset/**         (changesets; not prose)
#   - the GitHub wiki       (separate repository)
#
# The job is gated on `paths` so it does not run on PRs that do not
# touch the public documentation.

on:
  pull_request:
    paths:
      - 'apps/web/content/**'
      - '.vale.ini'
      - '.vale/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Vale (apps/web/content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale 3.x needs an external parser for MDX files. We install
      # `mdx2vast` (the official Vale companion) so the lint does not
      # fail with `mdx2vast not found` on the first .mdx file.
      - name: Install mdx2vast
        run: npm install -g mdx2vast

      - name: Run Vale
        uses: errata-ai/vale-action@v2.1.1
        with:
          # `filter` accepts a Vale filter expression (a glob-style
          # selector). `apps/web/content/docs/{index,getting-started,result,maybe,unit}.mdx`
          # picks up every public page except api-reference.mdx.
          filter: 'apps/web/content/docs/{index,getting-started,result,maybe,unit}.mdx'
          files: apps/web/content
          reporter: github
