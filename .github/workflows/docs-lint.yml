name: Docs lint (Vale)

# Runs Vale on the public documentation site only.
# Scope: the entire `apps/web/content` directory.
#
# Excluded (because the bundled MDX parser cannot handle them yet):
#   - apps/web/content/docs/api-reference.mdx
#     mdx2vast fails on generic type parameters that contain commas
#     (e.g. `interface Ok<T, E = never> { ... }`). The parser sees the
#     comma as an unexpected JSX attribute character. Re-enable once
#     mdx2vast supports it, or rewrite the offending blocks. The
#     exclusion lives in `.vale.ini` (`IgnoredPaths`), not here.
#
# Out of scope (handled by other tools or processes):
#   - packages/fp/src/**    (JSDoc; tracked by a follow-up lint:jsdoc script)
#   - docs/engineering/**   (internal docs; Vale can be extended later)
#   - .changeset/**         (changesets; not prose)
#   - the GitHub wiki       (separate repository)
#
# The job is gated on `paths` so it does not run on PRs that do not
# touch the public documentation.

on:
  pull_request:
    paths:
      - 'apps/web/content/**'
      - '.vale.ini'
      - '.vale/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Vale (apps/web/content)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Vale 3.x needs an external parser for MDX files. The action
      # installs Vale and reviewdog, but does not pull `mdx2vast`
      # automatically. Without it, the lint fails with
      # `mdx2vast not found` on the first .mdx file.
      - name: Install mdx2vast
        run: npm install -g mdx2vast

      - name: Vale
        uses: vale-cli/vale-action@v3.0.0
        with:
          # Point Vale at the whole directory. Vale walks every file
          # under apps/web/content. `.vale.ini` decides which paths
          # and rules apply, including which files to skip.
          files: apps/web/content
          # Pin to the repo's .vale.ini so the action cannot pick up a
          # different config from the runner environment.
          config: .vale.ini
          reporter: github-pr-check
          fail_on_error: false
