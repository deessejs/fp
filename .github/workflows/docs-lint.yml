name: Docs lint (Vale)

# Runs Vale on the public documentation site only.
# Scope is intentionally narrow: we invoke Vale directly so we have
# full control over which files get walked and which Vale flags we
# pass. vale-action's `files` input does not prevent Vale from
# also parsing the rest of the repo (notably .claude/agent-memory/
# *.md, which has a YAML-like frontmatter Vale mistakes for MDX).
#
# Linted pages:
#   - apps/web/content/docs/{index,getting-started,result,maybe,unit}.mdx
#
# Excluded for phase 1:
#   - apps/web/content/docs/api-reference.mdx
#     The MDX parser bundled with mdx2vast fails on the
#     `<TypeTable type={...}>` blocks (commas inside JSX attribute
#     values are not accepted by the current parser version). Re-
#     enabling it is tracked separately.
#
# Out of scope (handled by other tools or processes):
#   - packages/fp/src/**    (JSDoc; tracked by a follow-up lint:jsdoc script)
#   - docs/engineering/**   (internal docs; Vale can be extended later)
#   - .changeset/**         (changesets; not prose)
#   - the GitHub wiki       (separate repository)
#
# The job is gated on `paths` so it does not run on PRs that do not
# touch the public documentation.

on:
  pull_request:
    paths:
      - 'apps/web/content/**'
      - '.vale.ini'
      - '.vale/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vale:
    name: Vale (apps/web/content)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vale 3.x needs an external parser for MDX files. We install
      # `mdx2vast` (the official Vale companion) so the lint does not
      # fail with `mdx2vast not found` on the first .mdx file.
      - name: Install mdx2vast
        run: npm install -g mdx2vast

      - name: Install Vale
        uses: jdkato/vale-action@2.2.0
        with:
          # Pin to a specific Vale release so the install is reproducible
          # and we do not depend on GitHub's "latest" endpoint.
          version: 3.17.1

      - name: Run Vale
        run: |
          set -euo pipefail
          vale \
            --output=line \
            apps/web/content/docs/index.mdx \
            apps/web/content/docs/getting-started.mdx \
            apps/web/content/docs/result.mdx \
            apps/web/content/docs/maybe.mdx \
            apps/web/content/docs/unit.mdx
