name: Canary

# Per-PR snapshot publish for early feedback. Publishes to the
# npm dist-tag 'canary' without touching the official version or
# the branch's history. Comment on the PR with the install
# command when a snapshot is published.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: canary-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted Publishing also requires npm CLI >= 11.5.1 for
      # canary snapshot publishes.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      # A snapshot only makes sense if there is a changeset to
      # snapshot. Infra-only PRs (CI, docs, refactors) have no
      # changeset, so we skip cleanly instead of failing at publish
      # time. `changeset status` exits 0 with empty output when no
      # changesets are pending.
      - name: Detect pending changesets
        id: changesets
        run: |
          OUT=$(pnpm changeset status --since=origin/staging 2>&1 || true)
          if [ -z "$OUT" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pending changesets — skipping canary."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Pending changesets detected — proceeding with canary."
          fi

      - run: pnpm build

      # Generate a snapshot version like 0.0.0-canary-<timestamp>.
      # The --snapshot flag prevents the version bump from being
      # committed to the branch. Skipped when there is nothing to
      # snapshot (see "Detect pending changesets" above).
      - name: Snapshot version
        if: steps.changesets.outputs.found == 'true'
        run: pnpm changeset version --snapshot canary

      - name: Publish snapshot to canary tag
        if: steps.changesets.outputs.found == 'true'
        run: pnpm changeset publish --tag canary --no-git-tag

      - name: Comment on PR with install instructions
        if: steps.changesets.outputs.found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const pkg = require('./packages/fp/package.json');
            const ver = pkg.version;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `✅ Canary snapshot published: \`${pkg.name}@${ver}\``,
                '',
                'Install with:',
                '```',
                `pnpm add ${pkg.name}@canary`,
                '```',
                '',
                '_This is a snapshot build. Do not depend on it in production._',
              ].join('\n'),
            });
