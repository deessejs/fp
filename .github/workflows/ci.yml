name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint --force

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo type-check --force

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --force

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm turbo test --filter=@deessejs/fp

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      # --filter=@deessejs/fp limits the run to this package. The other
      # workspace packages (apps/web) don't have a test:coverage script,
      # so an unfiltered turbo run would refuse to execute any task.
      - run: pnpm turbo test:coverage --filter=@deessejs/fp

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: packages/fp/coverage
          retention-days: 14

      - name: Render coverage table
        if: success()
        id: render
        run: node .github/scripts/render-coverage.mjs

      - name: Post coverage comment
        if: success()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          message: ${{ steps.render.outputs.markdown }}

  changeset-check:
    name: Changeset check
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.base.ref == 'staging'
      && !contains(github.event.pull_request.labels.*.name, 'bot:backmerge')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify a Changeset file is present in the PR diff
        run: |
          BASE=${{ github.event.pull_request.base.ref }}
          git fetch origin "$BASE"
          if ! git merge-base --is-ancestor "origin/$BASE" HEAD; then
            echo "::error::PR head is not ahead of origin/$BASE. Refusing to diff."
            exit 1
          fi
          ADDED=$(git diff --name-only origin/$BASE...HEAD \
            | grep -E '^\.changeset/.*\.md$' \
            | grep -v 'README.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "::error::No Changeset file in this PR."
            echo "::error::Every PR targeting ${{ github.event.pull_request.base.ref }} must add a file under .changeset/."
            echo "::error::See docs/engineering/process/changesets.md § 7.1."
            echo "::error::For no-user-impact changes, run: pnpm changeset --empty"
            exit 1
          fi
          echo "Changeset(s) found:"
          echo "$ADDED"
