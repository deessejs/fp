StylesPath = .vale/styles
MinAlertLevel = warning

# Core (global) options. Vale 3.x rejects `IgnoredScopes` if it
# appears inside a `[*.{md,mdx}]` section; it must be defined here.
IgnoredScopes = code, fenced_code, link, image, inline_code

# Limit Vale to the public documentation site only.
# `docs/engineering/**`, `packages/fp/src/**`, and the GitHub wiki are
# intentionally out of scope for this CI job.
[*.{md,mdx}]
BasedOnStyles = Vale
Vale.Flavor = techwriting
# Ignore content inside fenced code blocks (```ts ... ```) and
# inline code spans (`...`). Without this, Vale flags short variable
# names in TypeScript snippets.
BlockIgnores = (?s)```[\s\S]*?```, `[^`]+`
